<div class="flex h-dvh overflow-hidden">

  <!-- Sidebar -->
  <app-nav [isOpen]="isMenuOpen()" (close)="closeMenu()" />

  <!-- Overlay mobile -->
  @if (isMenuOpen()) {
    <div
      class="fixed inset-0 bg-black/40 z-[99] md:hidden"
      (click)="closeMenu()">
    </div>
  }

  <!-- Contenido principal -->
  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">

    <!-- Header mobile -->
    <header
      class="relative flex items-center justify-center bg-nido-green-dark px-2 pb-2.5 shadow-[0_2px_10px_rgba(31,58,58,0.25)] md:hidden"
      style="padding-top: max(0.625rem, env(safe-area-inset-top));">
      <button
        type="button"
        class="absolute left-1 flex h-11 w-11 flex-col items-center justify-center gap-[5px] rounded-full bg-transparent border-none cursor-pointer transition-colors active:bg-white/10"
        (click)="toggleMenu()"
        aria-label="Abrir menú">
        <span class="block w-[22px] h-[2px] bg-nido-cream rounded-sm"></span>
        <span class="block w-[22px] h-[2px] bg-nido-cream rounded-sm"></span>
        <span class="block w-[22px] h-[2px] bg-nido-cream rounded-sm"></span>
      </button>
      <img src="logo.png" alt="Nido" class="h-8 w-auto object-contain" />
    </header>

    <main class="w-full min-w-0 flex-1 overflow-x-hidden overflow-y-auto">
      <router-outlet />
    </main>

    @if (tutorial.hasCurrentTutorial()) {
      <button
        type="button"
        class="fixed right-4 top-[calc(max(0.625rem,env(safe-area-inset-top))+0.25rem)] z-[80] flex h-10 w-10 items-center justify-center rounded-full border border-nido-border/70 bg-white/90 text-nido-green-dark shadow-[0_8px_24px_rgba(31,58,58,0.16)] transition hover:-translate-y-0.5 hover:border-nido-gold hover:text-nido-gold dark:bg-[#1c2320] dark:text-nido-cream md:right-5 md:top-5"
        aria-label="Ver tutorial de esta pantalla"
        title="Ayuda"
        (click)="startHelp()">
        <lucide-icon name="circle-help" [size]="19" />
      </button>
    }

  </div>

</div>
