<div class="flex h-dvh overflow-hidden">

  <!-- Sidebar -->
  <app-nav [isOpen]="isMenuOpen()" />

  <!-- Overlay mobile -->
  @if (isMenuOpen()) {
    <div
      class="fixed inset-0 bg-black/40 z-[99] md:hidden"
      (click)="closeMenu()">
    </div>
  }

  <!-- Contenido principal -->
  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">

    <!-- Header mobile -->
    <header class="flex items-center px-4 py-3 border-b border-gray-200 bg-white md:hidden">
      <button
        class="flex flex-col justify-center gap-[5px] bg-transparent border-none cursor-pointer p-2"
        (click)="toggleMenu()"
        aria-label="Abrir menú">
        <span class="block w-[22px] h-[2px] bg-nido-green-dark rounded-sm"></span>
        <span class="block w-[22px] h-[2px] bg-nido-green-dark rounded-sm"></span>
        <span class="block w-[22px] h-[2px] bg-nido-green-dark rounded-sm"></span>
      </button>
    </header>

    <main class="w-full min-w-0 flex-1 overflow-x-hidden overflow-y-auto">
      <router-outlet />
    </main>

  </div>

</div>
