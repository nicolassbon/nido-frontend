<div class="bg-nido-bg border border-nido-border rounded-[14px] p-5 flex flex-col h-full shadow-[0_1px_4px_rgba(38,63,48,0.07)]">

  <div class="flex items-center gap-2 mb-4">
    <lucide-icon [name]="icon" class="w-5 h-5 text-gray-900"></lucide-icon>
    <h2 class="text-lg font-bold text-gray-900 m-0">{{ title }}</h2>
  </div>

  <div class="flex flex-wrap gap-2 mb-5">
    @for (item of tag; track item) {
      <span class="bg-nido-cream text-nido-brown px-3 py-1 rounded-full text-[0.75rem] font-semibold border border-[#e5ddd0]">
        {{ item }}
      </span>
    }
  </div>

  <button class="mt-auto self-start bg-transparent border border-nido-muted rounded-full px-3 py-1 text-nido-muted text-[0.75rem] flex items-center gap-1.5 hover:bg-nido-cream hover:text-nido-green-dark transition-colors cursor-pointer">
    <span>> Editar {{ title }}</span>
  </button>

</div>
