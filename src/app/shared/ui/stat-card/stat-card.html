<div class="bg-white/[0.51] border border-nido-border rounded-[14px] p-5 flex items-start gap-4 shadow-[0_1px_4px_rgba(38,63,48,0.07)] h-full">
  <div class="bg-nido-green-dark rounded-[12px] w-12 h-12 flex items-center justify-center shrink-0">
    <lucide-icon [name]="icon" class="w-6 h-6 text-nido-cream"></lucide-icon>
  </div>
  <div class="flex-1">
    <h3 class="text-2xl font-bold text-gray-900 m-0 leading-none">{{ value }}</h3>
    <p class="text-[0.85rem] font-semibold text-gray-900 mt-1.5 mb-1">{{ title }}</p>
    <p class="text-[0.7rem] text-nido-muted">{{ subtitle }}</p>
  </div>
</div>
