<nav [class]="sidebarClass()">

  <!-- Logo -->
  <div class="px-2 pb-7">
    <img src="logo.png" alt="Nido" class="w-full max-w-[130px] object-contain" />
  </div>

  <!-- Items principales -->
  <ul class="list-none m-0 p-0 flex flex-col gap-0.5 flex-1">
    @for (item of mainNavItems; track item.route) {
      <li>
        @if (item.disabled) {
          <span
            aria-disabled="true"
            title="Próximamente"
            class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-nido-cream/35 no-underline text-[0.8125rem] cursor-not-allowed select-none">
            <lucide-icon [img]="icons[item.icon]" [size]="18" class="shrink-0" />
            <span>{{ item.label }}</span>
          </span>
        } @else {
          <a
            [routerLink]="item.route"
            routerLinkActive="!text-nido-cream !bg-nido-green font-medium"
            class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-nido-cream/60 no-underline text-[0.8125rem] transition-colors duration-150 hover:bg-nido-green hover:text-nido-cream">
            <lucide-icon [img]="icons[item.icon]" [size]="18" class="shrink-0" />
            <span>{{ item.label }}</span>
          </a>
        }
      </li>
    }
  </ul>

  <!-- Items de abajo -->
  <ul class="list-none m-0 pt-3 flex flex-col gap-0.5 border-t border-nido-cream/10">
    @for (item of bottomNavItems; track item.route) {
      <li>
        <a
          [routerLink]="item.route"
          routerLinkActive="!text-nido-cream !bg-nido-green font-medium"
          class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-nido-cream/60 no-underline text-[0.8125rem] transition-colors duration-150 hover:bg-nido-green hover:text-nido-cream">
          <lucide-icon [img]="icons[item.icon]" [size]="18" class="shrink-0" />
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
    <li>
      <button
        (click)="logout()"
        class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-nido-cream/60 bg-transparent border-none cursor-pointer text-[0.8125rem] transition-colors duration-150 hover:bg-nido-green hover:text-nido-cream">
        <lucide-icon [img]="icons['log-out']" [size]="18" class="shrink-0" />
        <span>Salir</span>
      </button>
    </li>
  </ul>

</nav>
