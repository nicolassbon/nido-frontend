<div
  class="fixed inset-0 bg-[rgba(31,58,58,0.72)] backdrop-blur-[2px] flex items-center justify-center z-[100] p-4"
  (click)="onCancel()"
>
  <div
    class="relative z-[101] bg-[#fff] rounded-[14px] w-full max-w-[450px] max-h-[calc(100vh-2rem)] overflow-hidden shadow-[0_18px_46px_rgba(31,58,58,0.28)]"
    (click)="$event.stopPropagation()"
  >
    <div class="relative min-h-[110px] overflow-hidden bg-nido-green-dark">
      <img
        src="/images/banners/miperfil.png"
        class="absolute inset-0 h-full w-full object-cover"
        alt=""
      />
      <div class="absolute inset-0 bg-[rgba(31,58,58,0.58)]"></div>

      <div class="relative z-10 flex h-full min-h-[110px] items-end justify-between gap-4 px-6 pb-4 pt-10">
        <div class="text-nido-cream">
          <h1 class="text-2xl font-bold leading-tight">Editar perfil</h1>
          <p class="text-[0.85rem] text-nido-cream/82 mt-1">
            Actualiza tu informacion personal y foto.
          </p>
        </div>
      </div>

      <button
        type="button"
        class="absolute right-4 top-3.5 z-20 flex h-8 w-8 items-center justify-center rounded-full border border-white/20 bg-white/12 text-nido-cream backdrop-blur-md cursor-pointer hover:bg-white/22 hover:scale-105 transition-all"
        (click)="onCancel()"
      >
        <lucide-icon name="x" [size]="18"></lucide-icon>
      </button>
    </div>

    <div class="px-6 py-4 bg-[#fff] overflow-y-auto max-h-[calc(100vh-10rem)]">
      <div
        *ngIf="isLoading()"
        class="rounded-[12px] bg-[#f7f3ef] border border-nido-border p-5 text-nido-green-dark text-sm"
      >
        Cargando datos...
      </div>

      <div *ngIf="apiError()" class="rounded-[12px] bg-red-100 text-red-700 px-4 py-3 mb-4 text-sm">
        {{ apiError() }}
      </div>

      <form [formGroup]="form" class="grid gap-4" *ngIf="!isLoading()">
        <div class="flex flex-col items-center gap-2">
          <div class="relative w-36 h-36 group cursor-pointer" (click)="fileInput.click()">
            <app-avatar
              [nombre]="form.value.nombre"
              [fotoUrl]="photoPreview() || fotoUrl()"
              sizeClass="w-full h-full border-[5px] border-nido-cream shadow-[0_6px_20px_rgba(38,63,48,0.16)] transition duration-300 group-hover:brightness-90 group-hover:scale-[1.02]"
              fontSizeClass="text-4xl md:text-5xl"
            />

            <div
              class="absolute inset-0 flex flex-col items-center justify-center rounded-full bg-nido-green-dark/72 opacity-0 group-hover:opacity-100 transition-all duration-300 text-nido-bg text-[0.75rem] font-semibold"
            >
              <lucide-icon name="camera" class="w-4 h-4 mb-1"></lucide-icon>
              <span>Cambiar foto</span>
            </div>

            <button
              *ngIf="photoPreview() || fotoUrl()"
              type="button"
              (click)="onRemovePhoto($event)"
              class="absolute -top-1 -right-1 w-8 h-8 rounded-full bg-white text-red-600 shadow-md border border-red-100 hover:bg-red-50 hover:scale-105 transition-all flex items-center justify-center z-10 cursor-pointer"
              title="Quitar foto"
            >
              <lucide-icon name="x" class="w-4 h-4"></lucide-icon>
            </button>

            <input
              #fileInput
              type="file"
              accept="image/jpeg,image/png,image/webp"
              class="hidden"
              (change)="onPhotoSelected($event)"
            />
          </div>

          <span *ngIf="photoError()" class="text-red-600 text-xs text-center font-medium">
            {{ photoError() }}
          </span>

          <span *ngIf="photoPreview()" class="text-nido-green-dark text-xs font-semibold">
            Nueva imagen seleccionada.
          </span>

          <span *ngIf="removeFoto()" class="text-nido-brown text-xs font-semibold">
            Se quitará la foto actual.
          </span>
        </div>

        <label class="block text-[0.825rem] font-semibold text-nido-brown">
          Nombre del perfil
          <input
            type="text"
            formControlName="nombre"
            class="w-full mt-1.5 px-4 py-2.5 border-[1.5px] border-nido-border rounded-[12px] bg-[#fff] text-nido-green-dark outline-none transition-all duration-200 hover:border-nido-brown/70 focus:border-nido-green focus:shadow-[0_0_0_3px_rgba(62,94,74,0.14)]"
          />
          <span class="block mt-1 text-xs text-nido-muted font-normal">
            Este es el nombre con el que te identificaran en tus hogares.
          </span>
        </label>

        <label class="block text-[0.825rem] font-semibold text-nido-brown">
          Celular
          <input
            type="tel"
            formControlName="telefono"
            class="w-full mt-1.5 px-4 py-2.5 border-[1.5px] border-nido-border rounded-[12px] bg-[#fff] text-nido-green-dark outline-none transition-all duration-200 hover:border-nido-brown/70 focus:border-nido-green focus:shadow-[0_0_0_3px_rgba(62,94,74,0.14)]"
          />
          <span class="block mt-1 text-xs text-nido-muted font-normal">
            Lo usamos para enviarte notificaciones cuando corresponda.
          </span>
        </label>

        <div class="grid gap-2">
          <span class="text-[0.85rem] font-semibold text-nido-brown">Sexo</span>
          <div class="flex flex-wrap gap-2">
            <button
              type="button"
              class="px-4 py-2 rounded-full border text-[0.82rem] font-semibold transition-all duration-200 cursor-pointer hover:-translate-y-0.5 hover:shadow-[0_8px_18px_rgba(38,63,48,0.10)]"
              [ngClass]="
                form.get('sexo')?.value === 'Femenino'
                  ? 'bg-nido-green-dark text-nido-cream border-nido-green-dark'
                  : 'bg-[#fff] text-nido-green-dark border-nido-border hover:bg-[#f7f3ef] hover:border-nido-brown'
              "
              (click)="form.patchValue({ sexo: 'Femenino' })"
            >
              Femenino
            </button>

            <button
              type="button"
              class="px-4 py-2 rounded-full border text-[0.82rem] font-semibold transition-all duration-200 cursor-pointer hover:-translate-y-0.5 hover:shadow-[0_8px_18px_rgba(38,63,48,0.10)]"
              [ngClass]="
                form.get('sexo')?.value === 'Masculino'
                  ? 'bg-nido-green-dark text-nido-cream border-nido-green-dark'
                  : 'bg-[#fff] text-nido-green-dark border-nido-border hover:bg-[#f7f3ef] hover:border-nido-brown'
              "
              (click)="form.patchValue({ sexo: 'Masculino' })"
            >
              Masculino
            </button>

            <button
              type="button"
              class="px-4 py-2 rounded-full border text-[0.82rem] font-semibold transition-all duration-200 cursor-pointer hover:-translate-y-0.5 hover:shadow-[0_8px_18px_rgba(38,63,48,0.10)]"
              [ngClass]="
                form.get('sexo')?.value === 'Otro'
                  ? 'bg-nido-green-dark text-nido-cream border-nido-green-dark'
                  : 'bg-[#fff] text-nido-green-dark border-nido-border hover:bg-[#f7f3ef] hover:border-nido-brown'
              "
              (click)="form.patchValue({ sexo: 'Otro' })"
            >
              Otro
            </button>
          </div>
        </div>

        <div class="flex gap-3 flex-wrap pt-2">
          <button
            type="button"
            class="flex-1 py-3 rounded-[12px] bg-nido-green-dark text-nido-cream font-semibold transition-all duration-200 hover:bg-nido-green hover:-translate-y-0.5 hover:shadow-[0_10px_22px_rgba(38,63,48,0.18)] disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:translate-y-0 disabled:hover:shadow-none"
            (click)="onSave()"
            [disabled]="isSaving()"
          >
            {{ isSaving() ? 'Guardando...' : 'Guardar' }}
          </button>

          <button
            type="button"
            class="flex-1 py-3 rounded-[12px] border border-nido-border bg-[#fff] text-nido-brown font-semibold transition-all duration-200 hover:bg-[#f7f3ef] hover:-translate-y-0.5 hover:shadow-[0_10px_22px_rgba(38,63,48,0.12)]"
            (click)="onCancel()"
          >
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
