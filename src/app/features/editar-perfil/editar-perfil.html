<section class="min-h-full px-6 py-8">
  <div class="mx-auto flex w-full max-w-[836px] flex-col gap-5">

    <a routerLink="/perfil"
       class="w-fit text-[0.9rem] font-semibold text-nido-green-dark no-underline transition-colors duration-150 hover:text-nido-green">
      ← Volver al perfil
    </a>

    <header class="relative overflow-hidden rounded-[14px] px-6 py-6 [background:linear-gradient(100deg,#263F30_0%,#315642_50%,#927357_100%)] shadow-[0_4px_14px_rgba(38,63,48,0.16)]">
      <div class="flex items-center gap-3">
        <span class="flex h-[46px] w-[46px] shrink-0 items-center justify-center rounded-[10px] bg-[rgba(247,241,230,0.16)] ring-1 ring-[rgba(247,241,230,0.22)]">
          <lucide-icon name="user-round-pen" [size]="22" class="text-nido-cream/80" />
        </span>
        <div class="min-w-0">
          <h1 class="text-[1.45rem] font-bold leading-tight text-nido-cream">Editar perfil</h1>
          <p class="mt-0.5 text-[0.9rem] text-nido-cream/75">Modificá tus datos y guardá cuando termines.</p>
        </div>
      </div>
    </header>

    <div *ngIf="isLoading()"
         class="rounded-[14px] border border-nido-border bg-white px-6 py-8 text-center text-[0.9rem] text-nido-muted shadow-sm">
      Cargando datos...
    </div>

    <div *ngIf="apiError() && !isLoading()"
         class="flex items-center gap-2 rounded-lg border border-[rgba(180,76,60,0.25)] bg-[rgba(180,76,60,0.06)] px-4 py-3 text-[0.875rem] font-medium text-nido-red">
      <lucide-icon name="alert-circle" [size]="16" />
      {{ apiError() }}
    </div>

    <form *ngIf="!isLoading()" [formGroup]="form"
          class="rounded-[14px] border border-nido-brown bg-white px-6 py-6 shadow-[0_3px_12px_rgba(38,63,48,0.09)]">

      <div class="grid gap-x-6 gap-y-5 sm:grid-cols-2">

        <!-- ── Foto de perfil ──────────────────────────────── -->
        <div class="flex flex-col items-center gap-3 sm:col-span-2">
          <div class="relative cursor-pointer group" (click)="fileInput.click()">
            <img
              [src]="photoPreview() || fotoUrl() || '/images/default-avatar.png'"
              (error)="onImgError($event)"
              alt="Foto de perfil"
              class="w-24 h-24 rounded-full object-cover border-[3px] border-nido-cream shadow-md transition duration-200 group-hover:brightness-75" />
            <div class="absolute inset-0 flex flex-col items-center justify-center rounded-full bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity duration-200 text-white text-[0.7rem] font-semibold gap-1">
              <lucide-icon name="camera" [size]="18" />
              <span>Cambiar</span>
            </div>
            <button *ngIf="photoPreview()" type="button" (click)="onRemovePhoto($event)"
              class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-white text-nido-red shadow border border-nido-border hover:scale-105 transition-all flex items-center justify-center z-10 cursor-pointer">
              <lucide-icon name="x" [size]="12" />
            </button>
          </div>
          <span *ngIf="photoPreview()" class="text-[0.75rem] font-semibold text-nido-green-dark">Nueva imagen seleccionada</span>
          <span *ngIf="photoError()" class="text-[0.75rem] font-medium text-nido-red">{{ photoError() }}</span>
          <input #fileInput type="file" accept="image/jpeg,image/png,image/webp" class="hidden" (change)="onPhotoSelected($event)" />
        </div>

        <!-- ── Nombre ──────────────────────────────────────── -->
        <label class="flex flex-col gap-1.5 sm:col-span-2">
          <span class="text-[0.82rem] font-semibold text-nido-green-dark">Nombre del perfil</span>
          <input
            type="text"
            formControlName="nombre"
            placeholder="Tu nombre"
            class="h-12 w-full rounded-lg border-[1.5px] border-solid bg-white px-4 text-[0.95rem] text-nido-green-dark outline-none transition-colors duration-150 placeholder:text-nido-muted focus:shadow-[0_0_0_3px_rgba(31,58,58,0.08)]"
            [class.border-nido-red]="form.controls.nombre.invalid && form.controls.nombre.touched"
            [class.border-nido-brown]="!(form.controls.nombre.invalid && form.controls.nombre.touched)"
            [class.focus:border-nido-green-dark]="!(form.controls.nombre.invalid && form.controls.nombre.touched)"
          />
          <span *ngIf="form.controls.nombre.invalid && form.controls.nombre.touched"
                class="text-[0.75rem] font-medium text-nido-red">Ingresá tu nombre.</span>
          <span class="text-[0.75rem] text-nido-muted">Así te identificarán en los hogares a los que pertenezcás.</span>
        </label>

        <!-- ── Teléfono ────────────────────────────────────── -->
        <label class="flex flex-col gap-1.5 sm:col-span-2">
          <span class="text-[0.82rem] font-semibold text-nido-green-dark">
            Celular <span class="font-normal text-nido-muted">(opcional)</span>
          </span>
          <input
            type="tel"
            formControlName="telefono"
            placeholder="+54 9 11 0000-0000"
            class="h-12 w-full rounded-lg border-[1.5px] border-solid border-nido-brown bg-white px-4 text-[0.95rem] text-nido-green-dark outline-none transition-all duration-150 placeholder:text-nido-muted focus:border-nido-green-dark focus:shadow-[0_0_0_3px_rgba(31,58,58,0.08)]"
          />
          <span class="text-[0.75rem] text-nido-muted">Para el envío de notificaciones.</span>
        </label>

        <!-- ── Sexo ───────────────────────────────────────── -->
        <div class="flex flex-col gap-2 sm:col-span-2">
          <span class="text-[0.82rem] font-semibold text-nido-green-dark">Sexo</span>
          <div class="flex flex-wrap gap-2">
            <button *ngFor="let opt of sexoOpts" type="button"
              class="px-5 py-2 rounded-full border-[1.5px] border-solid text-[0.875rem] font-medium transition-all duration-150 cursor-pointer"
              [class.border-nido-green-dark]="form.controls.sexo.value === opt"
              [class.bg-nido-green-dark]="form.controls.sexo.value === opt"
              [class.text-nido-cream]="form.controls.sexo.value === opt"
              [class.border-nido-border]="form.controls.sexo.value !== opt"
              [class.bg-white]="form.controls.sexo.value !== opt"
              [class.text-nido-brown]="form.controls.sexo.value !== opt"
              (click)="form.patchValue({ sexo: opt })">
              {{ opt }}
            </button>
          </div>
          <span *ngIf="form.controls.sexo.invalid && form.controls.sexo.touched"
                class="text-[0.75rem] font-medium text-nido-red">Seleccioná una opción.</span>
        </div>

      </div>

      <!-- ── Acciones ────────────────────────────────────── -->
      <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <button type="button" (click)="onCancel()"
          class="inline-flex h-11 min-w-[108px] items-center justify-center rounded-lg border-[1.5px] border-solid border-nido-brown bg-white px-5 text-[0.875rem] font-semibold text-nido-brown transition-colors duration-150 hover:text-nido-green-dark cursor-pointer">
          Cancelar
        </button>
        <button type="button" (click)="onSave()" [disabled]="isSaving()"
          class="inline-flex h-11 min-w-[114px] items-center justify-center gap-2 rounded-lg border-none bg-nido-green-dark px-6 text-[0.9rem] font-bold text-nido-cream transition-colors duration-150 hover:bg-nido-green disabled:cursor-not-allowed disabled:opacity-60 cursor-pointer">
          <span *ngIf="isSaving()" class="h-4 w-4 rounded-full border-2 border-solid border-nido-cream/45 border-t-nido-cream animate-spin"></span>
          Guardar
        </button>
      </div>

    </form>

  </div>
</section>
