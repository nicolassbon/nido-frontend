name: Frontend CI

on:
  push:
    branches: [ "main", "dev-frontend" ]
  pull_request:
    branches: [ "main", "dev-frontend" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run Tests
      run: npm run test:ci

    - name: Build
      run: npm run build
